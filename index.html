
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEXCHAT</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">VEX<span>CHAT</span></div>
    <p class="muted">Your conversations, all in one place.</p>

    <div id="authError" class="error"></div>

    <input id="authEmail" type="email" placeholder="Email address">
    <input id="authPassword" type="password" placeholder="Password">

    <input id="authUsername" placeholder="Username (for sign up)">

    <button id="loginBtn">Log In</button>
    <button id="signupBtn" class="secondary">Create Account</button>
  </div>
</div>

<div id="app" class="app hidden">

  <aside class="server-sidebar">
    <div class="server-logo">V</div>
    <div class="server-icon active">⌂</div>
    <div class="server-icon">✉</div>
    <div class="server-icon">⚙</div>
  </aside>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>VEXCHAT</h2>
      <span>⌄</span>
    </div>

    <div class="search-wrap">
      <input id="userSearch" placeholder="Find users...">
    </div>

    <div class="section-title">MESSAGES</div>
    <div id="friendsList" class="friends-list">
      <p class="muted">Your friends will appear here.</p>
    </div>

    <div class="section-title">FRIEND REQUESTS</div>
    <div id="requestsList"></div>

    <div class="user-panel">
      <div class="avatar" id="myAvatar">V</div>
      <div class="user-details">
        <strong id="myUsername">User</strong>
        <small>Online</small>
      </div>
      <button id="logoutBtn" class="icon-button" title="Log out">↪</button>
    </div>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <div>
        <h3 id="chatTitle">Welcome to VEXCHAT</h3>
        <p id="chatSubtitle">Choose a friend to start chatting.</p>
      </div>
      <button id="addFriendBtn" class="secondary">+ Add Friend</button>
    </header>

    <section id="welcome" class="welcome">
      <div class="welcome-logo">V</div>
      <h1>Welcome to VEXCHAT</h1>
      <p>Connect with friends and start a conversation.</p>
    </section>

    <section id="messages" class="messages hidden"></section>

    <form id="messageForm" class="message-form hidden">
      <input id="messageInput" placeholder="Message..." autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </main>
</div>

<div id="toast" class="toast"></div>

</body>
</html>
